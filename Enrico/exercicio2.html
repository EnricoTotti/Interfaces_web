<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    
</head>
<body>

    <h1>Cadastro de Produtos</h1>
    
    <div class="form-group">
        <label for="nomeProduto">Nome do Produto: </label>
        <input type="text" id="nomeProduto" size="30">
        
        <label for="estoqueInicial">Estoque: </label>
        <input type="number" id="estoqueInicial" style="width: 80px;">
        
        <button id="btnSalvar">Salvar Produto</button>
    </div>

    <table id="tabelaProdutos">
        <thead>
            <tr>
                <th style="width: 10%;">ID</th>
                <th style="width: 60%;">Produto</th>
                <th style="width: 30%;">Qtde Estoque</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>

    <h2>Adicionar/Retirar Estoque</h2>
    
    <div class="form-group">
        <label for="idProduto">Id do produto: </label>
        <input type="number" id="idProduto" style="width: 80px;">
        
        <label for="quantidadeMovimentacao">Quantidade: </label>
        <input type="number" id="quantidadeMovimentacao" style="width: 80px;">
        
        <div class="radio-group">
            <label>
                <input type="radio" name="operacao" value="adicionar" checked> Adicionar
            </label>
            <label>
                <input type="radio" name="operacao" value="remover"> Remover
            </label>
        </div>
        
        <button id="btnAtualizar">Confirmar</button>
    </div>

    <script src="ex2.js" type="text/javascript"></script>
</body>
</html>
